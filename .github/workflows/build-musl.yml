# Builds skia-bindings (crates.io) for x86_64- and aarch64-unknown-linux-musl in Alpine, with the features of rust-skia's
# glibc Linux prebuilts and no Dawn: musl builds serve headless servers, which draw with the CPU, and the consumer links
# Dawn only on Windows and macOS (an unresolved Dawn symbol fails the library's load on musl, which binds eagerly).
# rust-skia publishes no musl prebuilts. Publishes release <crate version>-musl-<arch>-<commit> with asset
# skia-binaries.tar.gz in skia-bindings' binary-cache layout.
# No JavaScript actions: GitHub runs those in Alpine containers only on x64.
name: build-musl

on:
  push:
    branches: [main, musl-dawn]
    paths: [.github/workflows/build-musl.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  CRATE_VERSION: 0.153.3
  SKIA_TAG: m153-0.101.2
  # Must match the consumer's skia-safe features (plus skia-bindings' defaults).
  FEATURES: graphite,vulkan

jobs:
  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: alpine:3.24
    timeout-minutes: 360
    env:
      TRIPLE: ${{ matrix.arch }}-unknown-linux-musl
    defaults:
      run:
        shell: bash
    steps:
      - name: Install tools
        shell: sh
        run: |
          set -e
          # gn: Skia's bin/fetch-gn fetches a glibc binary. fontconfig: Skia's font manager.
          apk add --no-cache bash build-base clang clang-dev curl fontconfig-dev git github-cli gn \
            linux-headers pkgconf python3 samurai
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-host "$TRIPLE"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so*' | head -1)")" >> "$GITHUB_ENV"

      - name: Skia
        run: |
          git clone --depth 1 --branch "$SKIA_TAG" https://github.com/rust-skia/skia.git "$RUNNER_TEMP/skia"
          cd "$RUNNER_TEMP/skia"
          GIT_SYNC_DEPS_SKIP_EMSDK=1 python3 tools/git-sync-deps

      - name: Build skia-bindings
        run: |
          cargo new --lib --vcs none "$RUNNER_TEMP/probe"
          cd "$RUNNER_TEMP/probe"
          cargo add "skia-bindings@=$CRATE_VERSION" --features "$FEATURES"
          # Same Skia-side optimization as the consumer (twip builds skia-bindings at opt-level "s").
          printf '\n[profile.release]\nopt-level = "s"\n' >> Cargo.toml
          # Dynamic build scripts (bindgen dlopens libclang; static musl can't). No --target, or RUSTFLAGS skips them.
          export RUSTFLAGS="-C target-feature=-crt-static"
          export SKIA_SOURCE_DIR="$RUNNER_TEMP/skia"
          export SKIA_GN_COMMAND=/usr/bin/gn
          export FORCE_SKIA_BUILD=1
          cargo build --release

      - name: Package
        run: |
          out=$(dirname "$(ls -t "$RUNNER_TEMP"/probe/target/release/build/skia-bindings-*/out/skia/bindings.rs | head -1)")
          skia="$RUNNER_TEMP/skia"
          stage="$RUNNER_TEMP/stage/skia-binaries"
          mkdir -p "$stage"
          ls "$out"
          cp "$out"/*.a "$out/bindings.rs" "$out/skia-defines.txt" "$stage"
          cp "$out"/*.dat "$stage" 2>/dev/null || true
          cp "$skia/LICENSE" "$stage/LICENSE_SKIA"
          tar -czf "$RUNNER_TEMP/skia-binaries.tar.gz" -C "$RUNNER_TEMP/stage" skia-binaries

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$CRATE_VERSION-musl-${{ matrix.arch }}-${GITHUB_SHA::7}"
          gh release create "$release" "$RUNNER_TEMP/skia-binaries.tar.gz" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "skia-bindings $CRATE_VERSION for $TRIPLE ($release)" \
            --notes "Skia $SKIA_TAG for $TRIPLE (built on Alpine 3.24); features $FEATURES plus skia-bindings' defaults (pdf, jpeg); no Dawn."
